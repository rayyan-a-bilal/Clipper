paths:
  data_dir: ./data

devices:
  ffmpeg: null
  ffprobe: null
  nvidia_smi: null
  # M6a — vision-segment GPU (docs/spec/m6.md): GPU0 2080 Super only;
  # the P100s (GPU1/GPU2) never do video.
  vision: "cuda:0"

# M5a — managed ephemeral Ollama runtime (docs/spec/llm.md, docs/spec/m5.md).
# The user's existing Ollama on 127.0.0.1:11434 is NEVER touched; M5 manages
# its own `ollama serve` on runtime_port with CUDA_VISIBLE_DEVICES=gpu_index.
# Legacy keys (endpoint/api_key/timeout) are kept for backward compatibility.
llm:
  provider: "ollama"
  manage_runtime: true
  base_url: "http://127.0.0.1:11435"
  runtime_port: 11435
  gpu_index: 1
  model: "gemma4:12b"
  models_dir: "/usr/share/ollama/.ollama/models"   # store actually holding gemma4:12b (see llm_runtime._resolve_models_dir); ~/.ollama/models is empty
  num_ctx: 16384            # PER REQUEST, not cumulative
  num_batch: 256
  temperature: 0.1
  num_predict: 2048
  timeout_s: 300
  startup_timeout_s: 60
  max_retries: 2
  batch_size: 5
  max_batch_tokens: 6000
  context_before_s: 10.0
  context_after_s: 10.0
  # legacy (pre-M5a), still honored if present:
  endpoint: null
  api_key: null
  timeout: 300

asr:
  model: large-v3-turbo  
  word_timestamps: true
  vad_filter: true
  condition_on_previous_text: false

clips:
  target_count: 3
  max_count: 5 
  min_duration: 15.0
  max_duration: 75.0
  overlap_threshold: 0.3
  hook_overlay_duration: 2.5
  # M4a — niche-specific keyword lists used by the candidate "niche" feature.
  # Empty by default (the niche feature falls back to a neutral 0.5).
  # e.g.
  #   niche_keywords:
  #     fitness:
  #       - "protein"
  #       - "workout"
  niche_keywords: {}

faces:
  detection_fps: 3.0
  min_detection_confidence: 0.5
  iou_threshold: 0.5
  # M6a — per-clip vision segment (docs/spec/m6.md): 960x540 fit, aspect
  # preserved, no padding, even dims; fps = min(native, vision_fps_cap),
  # native 0/unknown -> vision_fps_cap.
  vision_fps_cap: 30.0
  vision_width: 960
  vision_height: 540
  # M6b — YuNet ONNX face detector (docs/spec/m6.md): runs on GPU0 via
  # onnxruntime CUDAExecutionProvider (never silently on CPU). Download the
  # model manually with `bash scripts/install_models.sh` (never in tests).
  model_path: data/models/yunet.onnx
  score_threshold: 0.6
  nms_threshold: 0.3
  top_k: 5000
  det_size: 640
  # M6f — face_follow (face-stabilized zoom crop; docs/spec/m6.md M6f):
  # auto-selectable when the dominant face is below the 0.6 face_track
  # bar but at/above follow_persistence_min; pan law FOLLOW_* constants
  # live in src/clipper/layouts.py (M6f spec table). Both knobs are
  # dashboard-first: overridable, and `--layout face_follow` / `center_crop`
  # force per job.
  face_follow_enabled: true
  follow_persistence_min: 0.3

captions:
  font: Montserrat ExtraBold
  font_size: 88
  margin_v: 450
  safe_zone_right: 150
  safe_zone_top: 220
  max_words_per_group: 4
  max_chars_per_line: 20  
  max_lines: 2
  karaoke_highlight: yellow

render:
  output_width: 1080
  output_height: 1920
  crf: 14
  encoder: h264_nvenc
  # M7a (docs/spec/m7.md): NVENC quality/preset; GPU0 media only. CPU render
  # is a debug path (explicit), never a fallback.
  mezz_cq: 16
  final_cq: 19
  nvenc_preset: "p5"
  hwaccel: cuda
  cpu_render: false