paths:
  data_dir: ./data

devices:
  ffmpeg: null
  ffprobe: null
  nvidia_smi: null

# M5a — managed ephemeral Ollama runtime (docs/spec/llm.md, docs/spec/m5.md).
# The user's existing Ollama on 127.0.0.1:11434 is NEVER touched; M5 manages
# its own `ollama serve` on runtime_port with CUDA_VISIBLE_DEVICES=gpu_index.
# Legacy keys (endpoint/api_key/timeout) are kept for backward compatibility.
llm:
  provider: "ollama"
  manage_runtime: true
  base_url: "http://127.0.0.1:11435"
  runtime_port: 11435
  gpu_index: 1
  model: "gemma4:12b"
  models_dir: "/usr/share/ollama/.ollama/models"   # shared store of the running Ollama (rbilal ∈ ollama group); ~/.ollama/models is empty
  num_ctx: 16384            # PER REQUEST, not cumulative
  num_batch: 256
  temperature: 0.1
  num_predict: 1024
  timeout_s: 300
  startup_timeout_s: 60
  max_retries: 2
  batch_size: 5
  max_batch_tokens: 6000
  context_before_s: 10.0
  context_after_s: 10.0
  # legacy (pre-M5a), still honored if present:
  endpoint: null
  api_key: null
  timeout: 300

asr:
  model: large-v3-turbo  
  word_timestamps: true
  vad_filter: true
  condition_on_previous_text: false

clips:
  target_count: 3
  max_count: 5 
  min_duration: 15.0
  max_duration: 75.0
  overlap_threshold: 0.3
  hook_overlay_duration: 2.5
  # M4a — niche-specific keyword lists used by the candidate "niche" feature.
  # Empty by default (the niche feature falls back to a neutral 0.5).
  # e.g.
  #   niche_keywords:
  #     fitness:
  #       - "protein"
  #       - "workout"
  niche_keywords: {}

faces:
  detection_fps: 3.0
  min_detection_confidence: 0.5
  iou_threshold: 0.5

captions:
  font: Montserrat ExtraBold
  font_size: 88
  margin_v: 450
  safe_zone_right: 150
  safe_zone_top: 220
  max_words_per_group: 4
  max_chars_per_line: 20  
  max_lines: 2
  karaoke_highlight: yellow

render:
  output_width: 1080
  output_height: 1920
  crf: 14
  encoder: h264_nvenc