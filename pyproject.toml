[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Local, headless video clipping pipeline"
authors = [
    { name = "RBilal", email = "rbilal@example.com" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer",
    "pydantic>=2.0,<3.0",
    "pydantic-settings",
    "PyYAML",
    "filelock",
    "numpy",
    "click",
    "tqdm",
    # NOTE: install scenedetect with `pip install scenedetect --no-deps` and
    # provide cv2 via opencv-python-headless below. scenedetect>=0.7 declares
    # opencv-python as a dependency; the headless build is binary-compatible
    # (same `cv2` namespace) and opencv-python is FORBIDDEN on this headless
    # server (fails with libGL.so.1). `pip check` reports a false-positive
    # requirement warning for this pair — that is expected.
    "scenedetect",
    "opencv-python-headless",
    "pytest",
    "ruff",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
clipper = "src.clipper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clipper*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "get-pip.py",
    "test_m2b.py",
    "verify_m2a.py",
    "manual_verify.py",
    "debug_gap.py",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
# Manual runner scripts legitimately print to the console
"scripts/*.py" = ["T201"]

[tool.pytest.ini_options]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
]
testpaths = ["tests"]