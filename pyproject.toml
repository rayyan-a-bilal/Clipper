[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Local, headless video clipping pipeline"
authors = [
    { name = "RBilal", email = "rbilal@example.com" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer",
    "pydantic>=2.0,<3.0",
    "pydantic-settings",
    "PyYAML",
    "filelock",
    "pytest",
    "ruff",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
clipper = "src.clipper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clipper*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "T20",
]

[tool.pytest.ini_options]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
]
testpaths = ["tests"]